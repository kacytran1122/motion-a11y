name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The test toolchain needs Node 20 or newer. The published package supports
  # Node 18, which the smoke job below verifies against the real build output.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Build first: the end to end tests run the real CLI out of dist.
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run coverage

  # The lowest Node version the package claims to support. Vitest no longer runs
  # there, so this exercises the built artefacts directly instead.
  node18-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: node --version
      - run: npm run smoke
