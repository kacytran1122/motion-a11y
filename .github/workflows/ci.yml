name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Tests run on Node's own test runner, so every version the package supports
  # can run the whole suite, including the oldest one.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Build first: the end to end tests run the real CLI out of dist.
      - run: npm run build
      - run: npm test
      # Exercises the built ESM, CJS and CLI artefacts rather than the sources.
      - run: npm run smoke
      - run: npm audit --audit-level=high

  # Coverage thresholds need the flags Node 22 added.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run coverage
